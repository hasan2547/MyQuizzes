
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اختبار MCQ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Cairo:wght@400;700&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        body { font-family: 'Roboto', sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; height: 100vh; height: 100dvh; overflow: hidden; touch-action: manipulation; }
        .quiz-container { background-color: #1e1e1e; width: 100%; height: 100%; display: flex; flex-direction: column; padding: 20px 15px; max-width: 600px; margin: 0 auto; border-left: 1px solid #333; border-right: 1px solid #333; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #333; margin-bottom: 20px; flex-shrink: 0; }
        .q-count { color: #888; font-size: 0.9rem; font-weight: 500; }
        .subject-title { color: #2979ff; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 1.2rem; text-align: center;}
        .timer-box { background-color: #2c2c2c; color: #fff; padding: 6px 12px; border-radius: 4px; font-weight: bold; border: 1px solid #444; min-width: 70px; text-align: center; }
        .timer-box.warning { background-color: #4a1818; color: #ff6b6b; border-color: #ff6b6b; }
        .question-area { flex-grow: 1; overflow-y: auto; padding-bottom: 20px; }
        .question-text { font-family: 'Roboto', sans-serif; font-size: 1.1rem; font-weight: bold; margin-bottom: 25px; color: #ffffff; text-align: left; line-height: 1.5; direction: ltr; word-break: break-word;}
        .options-list { list-style: none; padding: 0; }
        .option { background-color: #2c2c2c; border: 1px solid #444; border-radius: 8px; padding: 15px; margin-bottom: 15px; cursor: pointer; font-size: 1rem; text-align: left; transition: background 0.2s; color: #ddd; display: flex; align-items: flex-start; gap: 10px; direction: ltr; }
        .option:active { background-color: #444; }
        .opt-letter { font-weight: bold; color: #2979ff; min-width: 25px; display: inline-block; }
        .opt-text { flex: 1; word-wrap: break-word; word-break: break-word; line-height: 1.4; }
        .option.correct { background-color: #1b5e20 !important; border-color: #00e676 !important; color: #fff; }
        .option.correct .opt-letter { color: #fff; }
        .option.wrong { background-color: #b71c1c !important; border-color: #ff1744 !important; color: #fff; }
        .option.wrong .opt-letter { color: #fff; }
        .disabled { pointer-events: none; }
        .navigation { margin-top: auto; display: flex; justify-content: space-between; padding-top: 15px; border-top: 1px solid #333; flex-shrink: 0; }
        button { background: #2979ff; color: white; border: none; padding: 15px 30px; border-radius: 6px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;}
        button:disabled { background-color: #444; color: #888; box-shadow: none; cursor: not-allowed; }
        .result-screen { display: none; text-align: center; height: 100%; overflow-y: auto; width: 100%;}
        .score-box { background: #2c2c2c; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #444; }
        .big-score { font-size: 3rem; font-weight: bold; color: #2979ff; display: block; }
        .review-section { text-align: left; margin-top: 10px; direction: ltr; }
        .review-item { background: #1e1e1e; border-bottom: 1px solid #333; padding: 15px 5px; }
        .review-q-text { font-family: 'Roboto', sans-serif; color: #fff; margin-bottom: 10px; font-size: 1rem; font-weight: bold; word-break: break-word;}
    </style>
</head>
<body>
<div class="quiz-container">
    <div id="quiz-screen" style="display:flex; flex-direction:column; height:100%;">
        <div class="header" id="main-header">
            <span class="q-count" id="q-progress"></span>
            <div id="titles-container" style="display:flex; flex-direction:column; align-items:center;">
                <span class="subject-title">📄 Mcq_نظري_٣</span>
            </div>
            <div class="timer-box" id="timer-box"><span id="timer">60</span>s</div>
        </div>
        <div class="question-area" id="main-q-area">
            <div class="question-text" id="question-text"></div>
            <ul class="options-list" id="options-list"></ul>
        </div>
        <div class="navigation" id="main-nav">
            <button id="prev-btn" onclick="prevQuestion()" disabled>Prev</button>
            <button id="next-btn" onclick="nextQuestion()">Next</button>
        </div>
    </div>
    <div id="result-screen" class="result-screen">
        <h2 style="color: #fff; margin-top:0;">Quiz Results</h2>
        <div class="score-box">
            <span class="big-score" id="score-text">0%</span>
            <p id="score-detail" style="color:#aaa; margin:5px 0 0;">0 / 0 Correct</p>
        </div>
        <div class="review-section" id="review-list"></div>
        <div style="padding: 20px 0;">
            <button onclick="restartQuiz()" style="width:100%; background:#00c853;">Restart</button>
        </div>
    </div>
</div>
<script>
    const questions = [{"answer": 1, "options": ["A. Hyperdense appearance of the affected cerebral cortex", "B. Loss of grey\u2013white matter differentiation with sulcal effacement", "C. Diffuse enlargement of the affected cerebral hemisphere", "D. Increased attenuation of the basal ganglia bilaterally", "E. Symmetrical calcification of the cerebral cortex"], "question": "Q1. In non-contrast CT brain imaging, which finding is most characteristic of an acute middle cerebral artery (MCA) territory infarction?"}, {"answer": 2, "options": ["A. Cerebral parenchymal haemorrhage", "B. Calcification of the arterial wall", "C. Acute intraluminal thrombus", "D. Increased cerebral blood flow", "E. Contrast accumulation within the artery"], "question": "Q2. The hyperdense MCA sign on non-contrast CT is primarily caused by:"}, {"answer": 1, "options": ["A. Crescent-shaped extra-axial hyperdensity crossing suture lines", "B. Biconvex hyperdense extra-axial collection limited by cranial sutures", "C. Diffuse hyperdensity within the cerebral sulci", "D. Hypodense subdural collection with cerebral atrophy", "E. Hyperdensity within the ventricular system"], "question": "Q3. Which CT finding is most suggestive of an acute epidural haematoma?"}, {"answer": 1, "options": ["A. Superior sagittal sinus", "B. Middle meningeal artery", "C. Anterior cerebral artery", "D. Bridging cortical veins", "E. Basilar artery"], "question": "Q4. Which anatomical structure is most commonly associated with the origin of an epidural haematoma following temporal bone fracture?"}, {"answer": 1, "options": ["A. Cerebral white matter", "B. Basal cisterns and cerebral sulci", "C. Lateral ventricular walls", "D. Corpus callosum", "E. Cerebellar white matter exclusively"], "question": "Q5. In acute subarachnoid haemorrhage, the most common initial CT distribution is:"}, {"answer": 1, "options": ["A. Large biconvex extra-axial haematoma", "B. Multiple small haemorrhagic foci at the grey\u2013white matter junction and corpus callosum", "C. Isolated intraventricular haemorrhage", "D. Diffuse symmetrical basal ganglia calcification", "E. Large territorial cortical infarction"], "question": "Q6. Which CT finding is most characteristic of diffuse axonal injury?"}, {"answer": 2, "options": ["A. Non-contrast CT", "B. Contrast-enhanced CT", "C. MRI diffusion-weighted imaging (DWI)", "D. T1-weighted MRI", "E. Skull radiography"], "question": "Q7. The most sensitive imaging modality for detecting early cytotoxic oedema in acute cerebral infarction is:"}, {"answer": 1, "options": ["A. Widening of the basal cisterns", "B. Medial displacement of the temporal lobe with compression of the ipsilateral cerebral peduncle", "C. Enlargement of the lateral ventricles", "D. Symmetrical enlargement of the cerebral sulci", "E. Increased attenuation of the choroid plexus"], "question": "Q8. Which CT feature is most suggestive of uncal (transtentorial) herniation?"}, {"answer": 1, "options": ["A. Epidural haematoma", "B. Acute subdural haematoma", "C. Subarachnoid haemorrhage", "D. Intraparenchymal haemorrhage", "E. Intraventricular haemorrhage"], "question": "Q9. In a patient with acute head trauma, the presence of a crescent-shaped extra-axial hyperdense collection is most consistent with:"}, {"answer": 1, "options": ["A. Reduced attenuation due to arterial occlusion", "B. Increased attenuation due to intraluminal thrombus", "C. Enhancement due to blood\u2013brain barrier disruption", "D. Calcification of the adjacent brain parenchyma", "E. Increased attenuation due to cerebral oedema"], "question": "Q10. Which of the following best explains the CT appearance of the hyperdense artery sign?"}, {"answer": 1, "options": ["A. Frontal cortex", "B. Putamen", "C. Corpus callosum", "D. Occipital cortex", "E. Hippocampus"], "question": "Q11. Which cerebral structure is most commonly involved in hypertensive intracerebral haemorrhage?"}, {"answer": 1, "options": ["A. Enlargement of the lateral ventricles with normal-sized third and fourth ventricles", "B. Enlargement of all ventricular compartments without an identifiable intraventricular obstructing lesion", "C. Isolated enlargement of the fourth ventricle", "D. Obliteration of the lateral ventricles", "E. Enlargement of the cerebral sulci without ventricular dilatation"], "question": "Q12. Which CT finding is most characteristic of communicating hydrocephalus?"}, {"answer": 2, "options": ["A. Vasogenic oedema predominantly affects the grey matter", "B. Cytotoxic oedema predominantly involves the extracellular space", "C. Vasogenic oedema predominantly involves the white matter and may preserve grey\u2013white differentiation", "D. Cytotoxic oedema always causes intracranial haemorrhage", "E. Both conditions have identical anatomical distributions"], "question": "Q13. Which CT feature is most useful in differentiating cerebral vasogenic oedema from cytotoxic oedema?"}, {"answer": 2, "options": ["A. Homogeneous enhancement without surrounding oedema", "B. Well-defined CSF-density lesion", "C. Irregular peripheral enhancement, central necrosis and extensive surrounding vasogenic oedema", "D. Symmetrical calcification without mass effect", "E. Uniformly low attenuation without enhancement or mass effect"], "question": "Q14. In CT evaluation of an intracranial mass, which finding most strongly suggests an aggressive high-grade neoplasm?"}, {"answer": 1, "options": ["A. Intra-axial lesion with central necrosis", "B. Extra-axial enhancing mass with a broad dural attachment, sometimes associated with hyperostosis", "C. Intraventricular cystic lesion without enhancement", "D. Diffuse infiltrative white matter lesion", "E. Haemorrhagic lesion centred in the basal ganglia"], "question": "Q15. Which of the following is the most characteristic CT appearance of a meningioma?"}, {"answer": 1, "options": ["A. Extra-axial lesion in the cerebellopontine angle", "B. Hyperdense or isoattenuating lesion near the foramen of Monro, potentially causing obstructive hydrocephalus", "C. Calcified lesion in the pineal gland", "D. Large cystic lesion in the occipital lobe", "E. Diffuse enlargement of the fourth ventricle"], "question": "Q16. Which CT finding is most characteristic of a colloid cyst?"}, {"answer": 0, "options": ["A. Hyperdense dural venous sinus", "B. Hypodense cerebral arteries", "C. Bilateral symmetrical basal ganglia calcification", "D. Diffuse enlargement of the ventricular system", "E. Increased attenuation of the optic nerves"], "question": "Q17. In a patient with suspected cerebral venous sinus thrombosis, which CT finding may be observed on non-contrast CT?"}, {"answer": 1, "options": ["A. Dilatation of the fourth ventricle", "B. Compression or obliteration of the fourth ventricle with possible obstructive hydrocephalus", "C. Enlargement of the basal cisterns", "D. Diffuse enlargement of the cerebral sulci", "E. Isolated enlargement of the frontal horns"], "question": "Q18. Which of the following is the characteristic CT feature of an acute cerebellar infarction with significant posterior fossa mass effect?"}, {"answer": 1, "options": ["A. Homogeneous solid enhancement", "B. Ring enhancement surrounding a central low-attenuation cavity", "C. Diffuse cortical hyperattenuation", "D. Uniform calcification without surrounding oedema", "E. Non-enhancing hyperdense extra-axial collection"], "question": "Q19. Which CT appearance is most characteristic of a mature brain abscess following contrast administration?"}, {"answer": 1, "options": ["A. Hyperdense biconvex collection", "B. Crescent-shaped hypodense extra-axial collection", "C. Hyperdensity confined to the basal cisterns", "D. Intraparenchymal hyperdensity with surrounding calcification", "E. Diffuse cerebral cortical enhancement"], "question": "Q20. Which CT finding is most characteristic of a chronic subdural haematoma?"}, {"answer": 0, "options": ["A. Improve visualization of cortical and white matter attenuation differences", "B. Increase spatial resolution of the scanner", "C. Eliminate all beam-hardening artefacts", "D. Increase the radiation dose to the patient", "E. Improve visualization of skull fractures"], "question": "Q21. In CT brain imaging, the principal purpose of using a narrow window width and appropriate window level for brain parenchyma is to:"}, {"answer": 1, "options": ["A. Tentorium cerebelli", "B. Lesser wing of the sphenoid bone", "C. Foramen magnum", "D. Petrous ridge exclusively", "E. Falx cerebri"], "question": "Q22. Which structure forms the anatomical boundary between the anterior and middle cranial fossae?"}, {"answer": 0, "options": ["A. Ventriculomegaly with disproportionately enlarged ventricles relative to the cortical sulci", "B. Isolated enlargement of the fourth ventricle", "C. Diffuse cerebral atrophy with proportionate ventricular enlargement", "D. Complete obliteration of the basal cisterns", "E. Generalized cerebral cortical hyperattenuation"], "question": "Q23. In an adult patient, which CT feature is most suggestive of normal pressure hydrocephalus (NPH)?"}, {"answer": 1, "options": ["A. A solitary hypodense lesion without enhancement", "B. A conglomerate of serpiginous enhancing vascular channels with possible feeding arteries and draining veins", "C. A uniformly calcified extra-axial mass", "D. A crescent-shaped collection along the cerebral convexity", "E. Diffuse symmetrical ventricular enlargement"], "question": "Q24. Which CT finding is most characteristic of a cerebral arteriovenous malformation (AVM)?"}, {"answer": 1, "options": ["A. Normal enhancement of the choroid plexus", "B. Enhancement of an intracranial lesion or brain parenchyma in an abnormal distribution", "C. Normal opacification of intracranial arteries", "D. Symmetrical calcification of the basal ganglia", "E. Normal enhancement of the dural venous sinuses"], "question": "Q25. During CT brain examination following intravenous contrast administration, which finding is most suggestive of disruption of the blood\u2013brain barrier?"}];
    const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    let currentQuestionIndex = 0; let score = 0; let userAnswers = new Array(questions.length).fill(null); let timeLeft = 60; let timerInterval;
    function startTimer() { timeLeft = 60; document.getElementById('timer').innerText = timeLeft; document.getElementById('timer-box').classList.remove('warning'); clearInterval(timerInterval); timerInterval = setInterval(() => { timeLeft--; document.getElementById('timer').innerText = timeLeft; if (timeLeft <= 10) document.getElementById('timer-box').classList.add('warning'); if (timeLeft === 0) { clearInterval(timerInterval); handleTimeUp(); } }, 1000); }
    function handleTimeUp() { userAnswers[currentQuestionIndex] = -1; const options = document.getElementById('options-list').children; for (let i = 0; i < options.length; i++) { options[i].classList.add('disabled'); options[i].style.opacity = "0.5"; } nextQuestion(); }
    function loadQuestion() {
        if(questions.length === 0) { document.getElementById('main-q-area').innerHTML = `<div style="text-align:center; color:#888; margin-top:50px;"><h2 style="color:#2979ff;">المحاضرة فارغة 📭</h2><p style="margin-top:10px; font-family:'Cairo'; line-height: 1.6;">لم يتم إضافة أي أسئلة بعد.</p></div>`; document.getElementById('main-nav').style.display = 'none'; document.getElementById('timer-box').style.display = 'none'; document.getElementById('q-progress').innerText = "0 / 0"; return; }
        const currentQuestion = questions[currentQuestionIndex]; const qText = currentQuestion.question.replace(/^\d+[\.\-]\s*/, ''); document.getElementById('question-text').innerText = (currentQuestionIndex + 1) + ". " + qText; document.getElementById('q-progress').innerText = `${currentQuestionIndex + 1} / ${questions.length}`; const optionsList = document.getElementById('options-list'); optionsList.innerHTML = ''; const isAnswered = userAnswers[currentQuestionIndex] !== null;
        currentQuestion.options.forEach((option, index) => { const li = document.createElement('li'); li.classList.add('option'); const letter = letters[index] || ''; li.innerHTML = `<span class="opt-letter">${letter}</span> <span class="opt-text">${option}</span>`; if (isAnswered) { li.classList.add('disabled'); if (index === currentQuestion.answer) li.classList.add('correct'); if (index === userAnswers[currentQuestionIndex] && index !== currentQuestion.answer) li.classList.add('wrong'); } else { li.onclick = () => selectOption(index, li); } optionsList.appendChild(li); });
        document.getElementById('prev-btn').disabled = currentQuestionIndex === 0; document.getElementById('next-btn').innerText = currentQuestionIndex === questions.length - 1 ? "Finish" : "Next"; if (!isAnswered) startTimer(); else { clearInterval(timerInterval); document.getElementById('timer').innerText = "-"; }
    }
    function selectOption(selectedIndex, element) { clearInterval(timerInterval); userAnswers[currentQuestionIndex] = selectedIndex; const currentQuestion = questions[currentQuestionIndex]; const options = document.getElementById('options-list').children; for (let i = 0; i < options.length; i++) options[i].classList.add('disabled'); if (selectedIndex === currentQuestion.answer) { element.classList.add('correct'); } else { element.classList.add('wrong'); setTimeout(() => { options[currentQuestion.answer].classList.add('correct'); }, 1000); } }
    function nextQuestion() { if (currentQuestionIndex < questions.length - 1) { currentQuestionIndex++; loadQuestion(); } else { showResults(); } }
    function prevQuestion() { if (currentQuestionIndex > 0) { currentQuestionIndex--; loadQuestion(); } }
    function showResults() { clearInterval(timerInterval); document.getElementById('quiz-screen').style.display = 'none'; document.getElementById('result-screen').style.display = 'block'; score = 0; const reviewList = document.getElementById('review-list'); reviewList.innerHTML = ''; questions.forEach((q, index) => { const userAnswer = userAnswers[index]; if (userAnswer === q.answer) score++; const reviewItem = document.createElement('div'); reviewItem.classList.add('review-item'); const qText = q.question.replace(/^\d+[\.\-]\s*/, ''); let optionsHtml = ''; q.options.forEach((opt, optIndex) => { let style = 'padding:10px; margin-bottom:5px; border-radius:4px; font-family:Roboto; display:flex; gap:10px; text-align:left;'; let letterStyle = 'font-weight:bold; min-width:20px;'; if (optIndex === q.answer) style += 'background: #1b5e20; border: 1px solid #00e676; color:white;'; else if (optIndex === userAnswer && userAnswer !== q.answer) style += 'background: #b71c1c; border: 1px solid #ff1744; color:white;'; else style += 'background: #2c2c2c; color:#888; border: 1px solid #444;'; optionsHtml += `<div style="${style}"><span style="${letterStyle}">${letters[optIndex]}</span><span style="flex:1; word-wrap:break-word;">${opt}</span></div>`; }); reviewItem.innerHTML = `<div class="review-q-text">${index + 1}. ${qText}</div><div style="direction: ltr;">${optionsHtml}</div>`; reviewList.appendChild(reviewItem); }); const percentage = Math.round((score / questions.length) * 100); document.getElementById('score-text').innerText = percentage + "%"; document.getElementById('score-detail').innerText = `${score} / ${questions.length} Correct`; }
    function restartQuiz() { currentQuestionIndex = 0; score = 0; userAnswers = new Array(questions.length).fill(null); document.getElementById('quiz-screen').style.display = 'flex'; document.getElementById('result-screen').style.display = 'none'; loadQuestion(); }
    loadQuestion();
</script>
</body>
</html>
